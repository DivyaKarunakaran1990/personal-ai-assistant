name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:

  backend:
    runs-on: ubuntu-latest #Runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23.10.0"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
        
    needs:
      - backend
      - frontend
        
    permissions:
      contents: read
      packages: write
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Build Docker image
        run: |
            IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}/personal-ai-backend" | tr '[:upper:]' '[:lower:]')
            docker build -t "$IMAGE_NAME:latest" ./backend
        
      - name: Push Docker image
        run: |
            IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}/personal-ai-backend" | tr '[:upper:]' '[:lower:]')
            docker push "$IMAGE_NAME:latest"

      - name: Build frontend Docker image
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}/personal-ai-frontend" | tr '[:upper:]' '[:lower:]')
          docker build -t "$IMAGE_NAME:latest" ./frontend

      - name: Push frontend Docker image
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}/personal-ai-frontend" | tr '[:upper:]' '[:lower:]')
          docker push "$IMAGE_NAME:latest"